kind = "web"
previewPath = "/"
title = "Aether Academy"
version = "1.0.0"
id = "artifacts/aether-academy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20879

[services.development]
run = "pnpm --filter @workspace/aether-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aether-academy", "run", "build" ]
serve = "static"
publicDir = "artifacts/aether-academy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20879"
BASE_PATH = "/"
